# expect: pipelines is new in atelier-machine/0.3
standard: atelier-machine/0.2
name: nvdla-nv-small
units:
  host:
    class: control.core
    params:
      BOOT_ADDR: 0
    control: isa
  cdma:
    class: movement.dma
    params:
      CHANNELS: 1
      WIDTH: 64
    note: convolution DMA, feature and weight fetch into CBUF
  rdma:
    class: movement.dma
    params:
      CHANNELS: 3
      WIDTH: 64
    note: SDP, PDP and CDP read and write DMAs, one channel each
  conv:
    class: compute.tensor
    params:
      ATOMIC_C: 8
      ATOMIC_K: 8
    formats:
    - int8
    control: registers
    registers:
      groups: 2
      kick: D_OP_ENABLE
      completion: interrupt
      bus: csb
    contract: nvdla/registers.json
  sdp:
    class: vector.post_op
    formats:
    - int8
    - int16
    control: registers
    registers:
      groups: 2
      kick: D_OP_ENABLE
      completion: interrupt
      bus: csb
    contract: nvdla/registers.json
  pdp:
    class: accelerator.op
    capabilities:
      ops:
      - maxpool
      - avgpool
    formats:
    - int8
    control: registers
    registers:
      groups: 2
      kick: D_OP_ENABLE
      completion: interrupt
      bus: csb
    contract: nvdla/registers.json
  cdp:
    class: accelerator.op
    capabilities:
      ops:
      - lrn
    formats:
    - int8
    control: registers
    registers:
      groups: 2
      kick: D_OP_ENABLE
      completion: interrupt
      bus: csb
    contract: nvdla/registers.json
memory:
- name: cbuf
  level: 1
  kind: scratchpad
  per: chip
  size: 128KiB
  banks: 32
  width: 64
- name: dram
  level: 2
  kind: dram
  per: chip
movement:
  dma:
  - engine: cdma
    from: dram
    to: cbuf
  - engine: rdma
    from: dram
    to:
    - sdp_in
    - pdp_in
    - cdp_in
  - engine: rdma
    from:
    - sdp_out
    - pdp_out
    - cdp_out
    to: dram
  streams:
  - name: sdp_in
    unit: sdp
    direction: in
    width: 64
  - name: sdp_out
    unit: sdp
    direction: out
    width: 64
  - name: pdp_in
    unit: pdp
    direction: in
    width: 64
  - name: pdp_out
    unit: pdp
    direction: out
    width: 64
  - name: cdp_in
    unit: cdp
    direction: in
    width: 64
  - name: cdp_out
    unit: cdp
    direction: out
    width: 64
pipelines:
- name: conv_out
  units:
  - conv
  - sdp
  - pdp
  fused: true
  note: SDP on the convolution's output, PDP on SDP's, without DRAM
interconnect:
  topology: bus
  protocol: axi4
  width: 64
  masters:
  - cdma
  - rdma
  slaves:
  - dram
control:
  model: application
  core: host
  os: linux
toolchain:
  compiler:
    command: nvdla_compiler (nvdla/sw umd)
    reads:
    - caffe model
    writes:
    - loadable
  functional:
    command: nvdla cmod
    reads:
    - loadable
    writes:
    - outputs
    evidence: estimate
  simulator:
    command: nvdla/hw verif, verilator
    reads:
    - trace
    writes:
    - outputs
    - cycles
    evidence: rtl-sim
  generator:
    command: tmake -build vmod (spec nv_small)
    writes:
    - verilog
    params:
      ATOMIC_C: 8
      ATOMIC_K: 8
      CBUF_BANKS: 32
      CBUF_BANK_DEPTH: 512
      CBUF_BANK_WIDTH_B: 8
      MEMIF_WIDTH: 64
      SDP_BS: true
      SDP_BN: true
      SDP_EW: false
      PDP: true
      CDP: true
      RUBIK: false
      BDMA: false
source:
  repo: https://github.com/nvdla/hw
  license: NVIDIA Open NVDLA License
  note: commit pinned at E1
space:
  toolchain.generator.params.ATOMIC_C:
  - 8
  - 16
  - 32
  - 64
  toolchain.generator.params.ATOMIC_K:
  - 8
  - 16
  - 32
  toolchain.generator.params.CBUF_BANKS:
  - 16
  - 32
  toolchain.generator.params.CBUF_BANK_DEPTH:
  - 256
  - 512
  toolchain.generator.params.MEMIF_WIDTH:
  - 64
  - 128
  - 256
