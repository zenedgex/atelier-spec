# NPU with separate tensor and vector units (R1.1). Draft format: atelier-machine/0.2.
standard: atelier-machine/0.2
name: npu-edge-4e

units:
  tensor:
    class: compute.tensor
    block: systolic_ws               # or systolic_os, cim_macro, a customer block
    params: {R: 32, C: 32, DW: 8}
    control: command
  vec:
    class: compute.vector
    block: simd_vec
    params: {LANES: 64, DW: 16}
    capabilities: {ops: [requant, add, mul, max, relu, silu, softmax, rmsnorm, rope]}
    control: command
  seq:   {class: control.sequencer, block: sequencer}
  core:  {class: control.core, block: cv32e40p, params: {BOOT_ADDR: 0x0000_0000}}
  dma:   {class: movement.dma, block: dma, params: {CHANNELS: 4, WIDTH: 64, DIMS: 4}}
  disp:  {class: control.dispatcher, block: dispatch}

clusters:
  engine:
    count: 4
    contains: [tensor, vec, seq, l1_a, l1_w, acc]
    wiring: sutra.engine/2

memory:
  - {name: l1_a, level: 1, kind: scratchpad, per: cluster, size: 128KiB, banks: 4, width: 256, ports: 1, share: arbiter, block: spad_banked}
  - {name: l1_w, level: 1, kind: scratchpad, per: cluster, size: 128KiB, banks: 4, width: 256, ports: 1, block: spad_banked}
  - {name: acc,  level: 1, kind: scratchpad, per: cluster, size: 32KiB,  banks: 2, width: 1024, block: acc_mem}
  - {name: l2,   level: 2, kind: scratchpad, per: chip, size: 2MiB, banks: 16, width: 512, ports: 4, block: sram_1rw}
  - {name: dram, level: 3, kind: dram, per: chip, type: lpddr4x, bandwidth: 17GB/s, block: dram_ctrl_ext}

movement:
  dma: [{engine: dma, from: dram, to: l2}, {engine: dma, from: l2, to: [l1_a, l1_w]}]

interconnect:
  topology: crossbar
  protocol: axi4
  width: 512
  masters: [core, dma]
  slaves: [l2, engine.*.regs, dram]

control: {model: microcontroller, core: core, os: none}

# spec 16: the core starts the dispatcher; queues: tensor, vec, and the DMA's 4 channels
dispatch: {by: disp, tokens: 32, depth: 16}

address_map:
  boot_rom:   {base: 0x0000_0000, size: 64KiB}
  l2:         {base: 0x1000_0000, size: 2MiB}
  engine_regs: {base: 0x2000_0000, size: 64KiB, stride: 16KiB}
  dram:       {base: 0x8000_0000, size: 1GiB}

clocks:
  core: {freq: 500MHz, units: [core, dma, l2]}
  engine: {freq: 1GHz, units: [engine]}

space:
  units.tensor.block: [systolic_ws, systolic_os, cim_macro]
  units.tensor.params.R: [16, 32, 64]
  memory.l2.size: [1MiB, 2MiB, 4MiB]
  clusters.engine.count: [1, 2, 4]
