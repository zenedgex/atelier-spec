# CIM accelerator (R1.4): the Sutra CIM engine around a CIM macro, with spec 16's dispatch: per
# engine a dispatcher and a DMA moving activation bands between ACT, the shared SRAM and DRAM while
# the engine computes. Swap `units.cim.block` for a customer macro.
standard: atelier-machine/0.2
name: sutra-cim-4e

units:
  cim:
    class: compute.tensor
    block: cim_macro                       # or customer/acme_cim, or sutra-cim-macro's model
    params: {R: 32, C: 16, DW: 8, IB: 2}
    capabilities: {kind: cim, weight_residency: true}
    control: command
  post: {class: vector.post_op, block: post_op}
  act:  {class: vector.elementwise, block: act_unit}
  row:  {class: vector.row, block: row_unit}
  seq:  {class: control.sequencer, block: sequencer}
  core: {class: control.core, block: cv32e40p}
  disp: {class: control.dispatcher, block: dispatch}
  dma:  {class: movement.dma, block: dma, params: {CHANNELS: 2, WIDTH: 32, DIMS: 4}}   # one in, one out

clusters:
  engine:
    count: 4
    contains: [cim, post, act, row, seq, disp, dma, l1_a, cmem, acc, actmem]
    wiring: sutra.engine/2

memory:
  - {name: l1_a,   level: 1, kind: scratchpad, per: cluster, size: 16KiB, banks: 4, width: 256, block: spad_banked}
  - {name: cmem,   level: 1, kind: compute, per: cluster, size: 8KiB, note: "inside the CIM macro; DEPTH 256 x C*DW"}
  - {name: acc,    level: 1, kind: scratchpad, per: cluster, size: 8KiB, block: acc_mem}
  - {name: actmem, level: 1, kind: scratchpad, per: cluster, size: 512KiB, banks: 4, share: arbiter, block: spad_banked}
  - {name: ram,    level: 2, kind: scratchpad, per: chip, size: 256KiB, block: sram_1rw}
  - {name: shared,     level: 2, kind: scratchpad, per: chip, size: 3MiB, banks: 8, width: 64, block: shared_sram}
  - {name: dram,   level: 3, kind: dram, per: chip, type: lpddr4x, bandwidth: 17GB/s}

movement:
  streams:
    - {name: rows_out, unit: post, direction: out, note: "the engine's result rows"}
    - {name: sensor_in, unit: act, direction: in, note: "a camera feeding ACT directly"}
  dma:
    - {engine: dma, from: dram, to: [actmem, l1_a, cmem, shared]}
    - {engine: dma, from: [actmem, rows_out], to: [shared, dram]}
    - {engine: dma, from: shared, to: actmem}

interconnect:
  topology: bus
  protocol: obi
  masters: [core]
  slaves: [ram, engine.*.regs]

control: {model: microcontroller, core: core, os: none}

# the core starts each engine's dispatcher; queues per engine: cim (the engine's commands) and the
# DMA's two channels
dispatch: {by: disp, per: engine, tokens: 16, depth: 16}

clocks:
  main: {freq: 500MHz, units: [core, engine, ram]}

space:
  units.cim.params.R: [32, 64]
  units.cim.params.IB: [1, 2, 4]
  clusters.engine.count: [1, 2, 4]
  memory.shared.size: [1MiB, 2MiB, 3MiB]
