[project]
name = "atelier-spec"
version = "0.1.0"
description = "Atelier standards: block contracts, machine descriptions, op set, evidence; schemas and checkers"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18", "pyyaml>=6"]

[project.optional-dependencies]
ops = ["numpy>=1.24"]
dev = ["pytest>=8", "numpy>=1.24"]

[project.scripts]
atelier-spec = "atelier_spec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atelier_spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
